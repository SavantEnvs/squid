http_port 3128
acl localnet src 10.0.0.0/8 fc00::/7
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow localnet
http_access deny all
deny_info 403 localnet
deny_info http://example.com/?u=%u localnet
request_header_add X-Foo "bar %>a" localnet
logformat custom %ts.%03tu %>a %Ss/%03>Hs %<st %rm %ru
refresh_pattern . 0 20% 4320
note key value localnet
